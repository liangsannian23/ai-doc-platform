server:
  port: 8080

spring:
  application:
    name: ai-doc-platform
  datasource:
    url: jdbc:mysql://localhost:3306/ai_doc_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}  # 敏感信息用环境变量，本地开发默认root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual   # 手动确认，配合消费者 basicAck/basicNack
        prefetch: 10
  # AI 配置：讯飞星火 Lite（OpenAI 兼容协议，spring.ai.openai 下只能有一套生效配置）
  ai:
    openai:
      base-url: ${SPARK_BASE_URL:https://maas-api.cn-huabei-1.xf-yun.com}
      api-key: ${SPARK_API_KEY}  # 星火 API Key（ak-...），从环境变量读取，绝不硬编码
      chat:
        completions-path: /v2/chat/completions   # 讯飞是 /v2，Spring AI 默认拼 /v1，必须显式覆盖
        options:
          model: ${SPARK_MODEL:spark-x2.5-1.7b}
          temperature: 0.7
    # 如需切回 OpenAI 官方：注释掉上面 openai 块，改用下面这套
    # openai:
    #   api-key: ${OPENAI_API_KEY}
    #   chat:
    #     options:
    #       model: gpt-4o-mini
    #       temperature: 0.7

# JWT 配置
jwt:
  secret: ${JWT_SECRET:my-default-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: 86400000  # 24小时

# Knife4j 接口文档配置
springdoc:
  swagger-ui:
    path: swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aidoc.aidocplatform.entity
  global-config:
    db-config:
      logic-delete-field: isDeleted  # 全局逻辑删除字段名
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志级别：调试缓存命中/失效（[Cache HIT]/[Cache MISS->WRITE]/[Cache EVICT]）与 MQ 消费
logging:
  level:
    com.aidoc: debug